services:
  gateway:
    build:
      context: ../..
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-18080}:8080"
    volumes:
      - ./data:/app
      - ./certs:/certs:ro
    command:
      - --config
      - /app/config.yaml
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --no-reload
      - --ssl-certfile
      - /certs/fullchain.pem
      - --ssl-keyfile
      - /certs/privkey.pem
    healthcheck:
      test: [CMD, wget, --no-check-certificate, -q, -O, /dev/null, "https://127.0.0.1:8080/health"]
